<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TALENT LINK</title>
<style>
:root{--ink:#181818;--muted:#717171;--line:#e6e5e2;--bg:#f6f6f4;--accent:#f6995d;--soft:#fff1e7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,'Malgun Gothic',sans-serif;font-size:14px;line-height:1.65}
main{max-width:760px;margin:0 auto;padding:64px 20px}
.brand{font-weight:900;letter-spacing:-1px;font-size:22px;display:flex;align-items:center;gap:10px}
.logo{display:inline-block;background:var(--accent);width:28px;height:28px;border-radius:7px;position:relative}
.logo:after{content:'';position:absolute;left:8px;top:6px;width:8px;height:12px;border-left:3px solid #171717;border-bottom:3px solid #171717;transform:rotate(-35deg)}
.eyebrow{font-size:10px;letter-spacing:2px;font-weight:bold;color:var(--muted);margin-top:40px}
h1{font-size:30px;letter-spacing:-1.4px;margin:8px 0 10px}
p{color:var(--muted);margin:0 0 28px}
a.card{display:block;background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px 24px;margin-bottom:14px;color:inherit;text-decoration:none}
a.card:hover{border-color:#999}
a.card strong{display:block;font-size:16px;margin-bottom:4px}
a.card span{color:var(--muted);font-size:12px}
.pill{display:inline-block;border:1px solid var(--line);border-radius:5px;font-size:11px;padding:2px 8px;background:#fff;margin-left:8px;vertical-align:middle}
.pill.soon{background:var(--soft);border-color:#f3c9ab;color:#8b481e}
footer{margin-top:48px;font-size:11px;color:#999;border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<main>
  <div class="brand"><span class="logo"></span>TALENT LINK</div>
  <div class="eyebrow">HANWHA AI SOLUTION CHALLENGE</div>
  <h1>그룹 전체에서 적합한 인재를 찾습니다.</h1>
  <p>TF·공석이 생기면 계열사를 넘어 후보를 탐색하고, 근거와 함께 추천합니다. 최종 판단은 인사팀이 합니다.</p>

  <a class="card" href="./talent_hr_admin.html">
    <strong>인사팀 채용 운영 콘솔 <span class="pill">시연 데이터</span></strong>
    <span>공고 관리 · 지원자 검토 · 인재 참여 제안 · 상사 추천 보고</span>
  </a>
  <a class="card" href="#" onclick="return false">
    <strong>AI 인재 매칭 <span class="pill soon">준비 중</span></strong>
    <span>JD 구조화 → 그룹 전수 탐색 → 종합 점수 · 정성 보고서 → 인사팀 Gate</span>
  </a>

  <footer>시연용 가상 데이터 · 실제 임직원 정보 없음</footer>
</main>
</body>
</html>
